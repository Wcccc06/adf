name: build-adf

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b
      - name: build host
        working-directory: host
        run: |
          CL=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang
          $CL -O2 -static -o adf_host adf_host.c -ldl
          ls -l adf_host
      - uses: actions/upload-artifact@v4
        with:
          name: adf_host
          path: host/adf_host
          retention-days: 5

  kpm:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b
      - name: clone KernelPatch headers
        run: |
          git clone --depth 1 https://github.com/bmax121/KernelPatch.git /opt/KernelPatch
          ls /opt/KernelPatch/kernel/include | head -5
      - name: build kpm
        working-directory: driver
        run: |
          make -f kpm.mk NDK_PATH=$ANDROID_NDK_HOME KP_DIR=/opt/KernelPatch
          echo '--- build result ---'
          ls -l *.kpm && file adf_driver.kpm
      - uses: actions/upload-artifact@v4
        with:
          name: adf_driver_kpm
          path: driver/adf_driver.kpm
          if-no-files-found: error
          retention-days: 5
