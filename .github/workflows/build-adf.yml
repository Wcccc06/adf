name: build-adf

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b
      - name: build host as executable .so
        working-directory: host
        run: |
          CL=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang
          $CL -O2 -fPIC -shared -Wl,-e,main -o adf_host.so adf_host_so.c
          $CL -O2 -o adf_host adf_host_so.c
          ls -l adf_host adf_host.so
      - uses: actions/upload-artifact@v4
        with:
          name: adf_host
          path: |
            host/adf_host.so
            host/adf_host
          retention-days: 5
