name: build-adf

# 触发：手动点一下，或推送代码时自动跑
on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  # 第一步：编宿主（纯用户态，NDK 一把过，用来先验证整条流水线通）
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b
      - name: build host
        working-directory: host
        run: |
          CL=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang
          $CL -O2 -static -o adf_host adf_host.c -ldl
          file adf_host
          ls -l adf_host
      - uses: actions/upload-artifact@v4
        with:
          name: adf_host
          path: host/adf_host
          retention-days: 3

  # 第二步：编内核驱动（要 GKI 源码 + 配置，允许失败，失败不影响宿主产物）
  driver:
    runs-on: ubuntu-large
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: fetch GKI android14-6.1 sources
        run: |
          sudo mkdir -p /opt/gki && cd /opt/gki
          curl -sL 'https://android.googlesource.com/kernel/common/+archive/refs/heads/android14-6.1.tar.gz' | sudo tar xz
          ls | head -5
      - name: prepare kernel config
        run: |
          cd /opt/gki
          sudo make ARCH=arm64 LLVM=1 defconfig || true
          echo 'CONFIG_MODULES=y' | sudo tee -a .config >/dev/null
      - name: build module
        working-directory: driver
        run: |
          sudo make -C /opt/gki M=$PWD ARCH=arm64 LLVM=1 modules || true
          ls -l *.ko || echo 'NO .ko PRODUCED'
      - uses: actions/upload-artifact@v4
        with:
          name: adf_driver
          path: driver/*.ko
          if-no-files-found: warn
          retention-days: 3
