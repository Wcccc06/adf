name: build-adf

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  # 1. 宿主（用户态，稳定）
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b
      - name: build host
        working-directory: host
        run: |
          CL=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang
          $CL -O2 -static -o adf_host adf_host.c -ldl
          ls -l adf_host
      - uses: actions/upload-artifact@v4
        with:
          name: adf_host
          path: host/adf_host
          retention-days: 5

  # 2. KPM（给 KernelPatch 内核用；本机内核不支持，留作备份）
  kpm:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b
      - run: git clone --depth 1 https://github.com/bmax121/KernelPatch.git /opt/KernelPatch
      - name: build kpm
        working-directory: driver
        run: |
          make -f kpm.mk NDK_PATH=$ANDROID_NDK_HOME KP_DIR=/opt/KernelPatch
          ls -l adf_kpm.kpm
      - uses: actions/upload-artifact@v4
        with:
          name: adf_driver_kpm
          path: driver/adf_kpm.kpm
          if-no-files-found: warn
          retention-days: 5

  # 3. 标准 LKM + kprobe（本机内核走这条）
  lkm:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b
      - name: locate llvm toolchain
        run: |
          TC=$(dirname $(dirname $(find /usr/local/lib/android/sdk/ndk /opt/hostedtoolcache -name 'ld.lld' -type f 2>/dev/null | head -1)))
          echo "found TC=$TC"
          "$TC/bin/ld.lld" --version
          "$TC/bin/clang" --version | head -1
          echo "TC=$TC" >> $GITHUB_ENV
      - name: fetch GKI android14-6.1 and prepare
        env:
        run: |
          export PATH="$TC/bin:$PATH"
          which ld.lld || echo 'still missing ld.lld'
          sudo mkdir -p /opt/gki && cd /opt/gki
          curl -sL 'https://android.googlesource.com/kernel/common/+archive/refs/heads/android14-6.1.tar.gz' | sudo tar xz
          sudo env PATH="$PATH" make ARCH=arm64 LLVM=1 defconfig > /dev/null
          sudo env PATH="$PATH" make ARCH=arm64 LLVM=1 modules_prepare > /dev/null
          ls include/generated/autoconf.h
      - name: build lkm
        working-directory: driver
        env:
        run: |
          make -f lkm.mk KDIR=/opt/gki TOOLCHAIN=$TC || true
          ls -l *.ko || echo 'NO .ko'
      - uses: actions/upload-artifact@v4
        with:
          name: adf_driver_lkm
          path: driver/adf_lkm.ko
          if-no-files-found: warn
          retention-days: 5
