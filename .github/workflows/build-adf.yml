name: build-adf

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  stealth-kpm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b
      - name: clone KernelPatch headers
        run: |
          git clone --depth 1 https://github.com/bmax121/KernelPatch.git /opt/KernelPatch
          ls /opt/KernelPatch/kernel/include | head -5
      - name: build adf-stealth.kpm
        working-directory: kpm
        run: |
          make NDK_PATH=$ANDROID_NDK_HOME KP_DIR=/opt/KernelPatch
          ls -l adf_stealth.kpm
          file adf_stealth.kpm
          readelf -S adf_stealth.kpm | grep -E 'kpm' || true
      - uses: actions/upload-artifact@v4
        with:
          name: adf_stealth_kpm
          path: kpm/adf_stealth.kpm
          if-no-files-found: error
          retention-days: 7
